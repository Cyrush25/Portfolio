<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cyrush // attack surface</title>
<meta name="description" content="Aarush Chandna — offensive security engineer. ASM & Active Directory red teaming. CRTP / CRTE / ADCS." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23070708'/><rect x='1' y='1' width='30' height='30' rx='6.5' fill='none' stroke='%23f0a23c' stroke-opacity='0.5'/><path d='M8 11l5 5-5 5' fill='none' stroke='%23f0a23c' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><line x1='16' y1='22' x2='24' y2='22' stroke='%23f0a23c' stroke-width='2.6' stroke-linecap='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506;
    --bg2:#0a0b0e;
    --panel:#0b0d11;
    --line:#191c23;
    --fg:#c4ccd6;
    --dim:#5c6675;
    --dimmer:#3a424e;
    --accent:#f0a23c;      /* amber phosphor */
    --accent2:#4ec9b0;     /* cool system tone */
    --ok:#7ee787;
    --warn:#ff5f56;
    --glow: 0 0 2px rgba(240,162,60,.55), 0 0 14px rgba(240,162,60,.12);
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html[data-theme="green"]{
    --accent:#7ee787;
    --accent2:#39d0a0;
    --glow: 0 0 2px rgba(126,231,135,.55), 0 0 14px rgba(126,231,135,.12);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(135% 105% at 12% -5%, #0e1219 0%, transparent 44%),
      radial-gradient(125% 115% at 92% 105%, #0a0f15 0%, transparent 50%),
      linear-gradient(160deg, #060709 0%, var(--bg) 52%, #000000 100%);
    background-attachment:fixed;
    color:var(--fg);
    font-family:var(--mono);
    font-size:15px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- ambient atmosphere ---------- */
  #grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(78,201,176,.05), transparent 60%),
      linear-gradient(transparent 0, transparent calc(100% - 1px), rgba(255,255,255,.018) 100%),
      linear-gradient(90deg, transparent 0, transparent calc(100% - 1px), rgba(255,255,255,.018) 100%);
    background-size:100% 100%, 34px 34px, 34px 34px;
  }
  #scan{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply; opacity:.5;
    animation:flicker 5s infinite steps(1);
  }
  @keyframes flicker{0%,100%{opacity:.5}3%{opacity:.42}6%{opacity:.5}48%{opacity:.5}50%{opacity:.44}52%{opacity:.5}}
  #vig{
    position:fixed; inset:0; z-index:61; pointer-events:none;
    box-shadow:inset 0 0 150px 4px rgba(0,0,0,.42);
  }
  #mx{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0; transition:opacity .6s}
  /* living gradient aura */
  #aura{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    background:
      radial-gradient(42vmax 42vmax at 12% 6%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 68%),
      radial-gradient(48vmax 48vmax at 90% 96%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 70%);
  }
  #aura::before,#aura::after{
    content:""; position:absolute; width:60vmax; height:60vmax; border-radius:50%;
    filter:blur(85px); opacity:.15; will-change:transform; mix-blend-mode:screen;
  }
  #aura::before{background:radial-gradient(circle, var(--accent), transparent 62%);
    top:-18vmax; left:-8vmax; animation:float1 26s ease-in-out infinite}
  #aura::after{background:radial-gradient(circle, var(--accent2), transparent 62%);
    bottom:-18vmax; right:-8vmax; animation:float2 32s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9vmax,6vmax) scale(1.16)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-9vmax,-5vmax) scale(1.1)}}

  /* ---------- shell frame ---------- */
  .shell{
    position:relative; z-index:5;
    height:100dvh; max-width:1040px; margin:0 auto;
    display:flex; flex-direction:column;
    padding:14px 14px 0;
    transform-origin:center;
    animation:turnon .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes turnon{
    0%{transform:scaleX(.4) scaleY(.004); filter:brightness(3) saturate(0); opacity:0}
    32%{transform:scaleX(1) scaleY(.01); opacity:1}
    58%{transform:scaleX(1) scaleY(1); filter:brightness(1.5)}
    100%{transform:scaleX(1) scaleY(1); filter:brightness(1) saturate(1)}
  }
  .bar{
    display:flex; align-items:center; gap:14px;
    padding:10px 14px;
    background:linear-gradient(rgba(20,24,31,.66),rgba(14,16,20,.5));
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
  }
  .dots{display:flex; gap:7px}
  .dots i{width:11px;height:11px;border-radius:50%;display:block;opacity:.85}
  .dots i:nth-child(1){background:var(--warn)}
  .dots i:nth-child(2){background:#f5be4f}
  .dots i:nth-child(3){background:var(--ok)}
  .title{color:var(--dim); font-size:12.5px; letter-spacing:.04em}
  .title b{color:var(--fg); font-weight:500}
  .status{margin-left:auto; display:flex; align-items:center; gap:16px; font-size:11.5px; color:var(--dim)}
  .status .live{color:var(--accent2)}
  .status .live::before{
    content:""; display:inline-block; width:7px;height:7px;border-radius:50%;
    background:var(--accent2); margin-right:6px; vertical-align:middle;
    box-shadow:0 0 8px var(--accent2); animation:pulse 1.8s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .status .clk{font-variant-numeric:tabular-nums}

  /* ---------- screen ---------- */
  .screen{
    flex:1; min-height:0;
    background:linear-gradient(180deg, rgba(16,19,25,.74), rgba(10,11,13,.82));
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border:1px solid var(--line);
    border-radius:0 0 8px 8px;
    padding:18px 18px 0;
    overflow-y:auto;
    scroll-behavior:smooth;
    scrollbar-width:thin; scrollbar-color:var(--dimmer) transparent;
  }
  .screen::-webkit-scrollbar{width:8px}
  .screen::-webkit-scrollbar-thumb{background:var(--dimmer); border-radius:8px}
  .out{white-space:pre-wrap; word-break:break-word}

  .ln{margin:0}
  .muted{color:var(--dim)}
  .dimmer{color:var(--dimmer)}
  .acc{color:var(--accent); text-shadow:var(--glow)}
  .acc2{color:var(--accent2)}
  .ok{color:var(--ok)}
  .warn{color:var(--warn)}
  .b{font-weight:700}
  .echo .p{color:var(--accent2)}
  .echo .c{color:var(--fg)}

  .pad{margin:4px 0 14px}
  .kv{display:grid; grid-template-columns:120px 1fr; gap:2px 14px; margin:6px 0 14px}
  .kv .k{color:var(--dim); display:flex; align-items:center; gap:8px}
  .mini{flex:none; width:14px; height:14px; color:var(--accent2); display:inline-flex; align-items:center}
  .mini svg{width:14px; height:14px; display:block}
  .kv .v{color:var(--fg)}

  .row{display:flex; gap:10px; align-items:baseline; margin:2px 0}
  .row .t{color:var(--dim); min-width:84px; font-size:12.5px}

  /* experience / project blocks */
  .block{position:relative; border-left:2px solid var(--line); padding:6px 0 8px 18px; margin:12px 0 20px;
    transition:border-color .25s, transform .25s}
  .block::before{content:""; position:absolute; left:-5px; top:12px; width:8px; height:8px; border-radius:50%;
    background:var(--bg); border:2px solid var(--dim); transition:.25s}
  .block.hit{border-color:var(--accent)}
  .block.hit::before{border-color:var(--accent); box-shadow:0 0 10px var(--accent)}
  .block:hover{border-color:var(--accent2); transform:translateX(2px)}
  .block:hover::before{border-color:var(--accent2)}
  .head{display:flex; gap:10px; flex-wrap:wrap; align-items:baseline}
  .head .role{color:var(--fg); font-weight:700; font-size:15px}
  .head .org{color:var(--accent); text-shadow:var(--glow)}
  .head .when{color:var(--dim); margin-left:auto; font-size:11.5px; letter-spacing:.04em;
    border:1px solid var(--line); padding:1px 8px; border-radius:4px}
  .summary{color:var(--dim); margin:6px 0 9px; font-size:13px}
  .li{display:flex; gap:10px; margin:5px 0; color:var(--fg)}
  .li::before{content:"\203A"; color:var(--accent2); flex:none}
  .li b{color:var(--accent); font-weight:700}

  /* impact stat strip */
  .stats{display:flex; flex-wrap:wrap; gap:18px; margin:11px 0 4px; padding-top:11px; border-top:1px dashed var(--line)}
  .stat{display:flex; flex-direction:column; line-height:1.15}
  .stat .n{color:var(--accent); font-size:18px; font-weight:800; text-shadow:var(--glow)}
  .stat .l{color:var(--dim); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase}

  /* tech chips */
  .stack{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px}
  .pill{font-size:11px; color:var(--accent2); border:1px solid color-mix(in srgb, var(--accent2) 40%, transparent);
    background:color-mix(in srgb, var(--accent2) 8%, transparent); padding:1px 8px; border-radius:20px}

  .tags{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 14px}
  .tag{border:1px solid var(--line); color:var(--dim); padding:2px 9px; border-radius:4px; font-size:12px}
  .tag.on{border-color:var(--accent); color:var(--accent)}

  a.link{color:var(--accent2); text-decoration:none; border-bottom:1px dotted var(--dimmer)}
  a.link:hover{border-bottom-color:var(--accent2)}

  /* client engagement cards */
  .finds{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 14px}
  .find{position:relative; display:flex; gap:11px; align-items:center;
    border:1px solid var(--line); border-radius:7px; padding:11px 13px;
    background:rgba(255,255,255,.012); overflow:hidden; transition:.2s}
  .find::after{content:""; position:absolute; inset:0; border-radius:7px; pointer-events:none;
    background:radial-gradient(120% 120% at 0% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%);
    opacity:0; transition:.25s}
  .find:hover{border-color:var(--accent); transform:translateY(-3px); box-shadow:0 8px 22px rgba(0,0,0,.5)}
  .find:hover::after{opacity:1}
  .find .logo{flex:none; width:42px; height:42px; border-radius:9px; display:grid; place-items:center;
    font-weight:800; font-size:15px; letter-spacing:-.02em; color:var(--accent); text-shadow:var(--glow);
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background:linear-gradient(150deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 80%)}
  .find.alt .logo{color:var(--accent2); text-shadow:none;
    border-color:color-mix(in srgb, var(--accent2) 45%, transparent);
    background:linear-gradient(150deg, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 80%)}
  .find .meta{flex:1; min-width:0}
  .find .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .find .org{color:var(--fg); font-weight:700}
  .find .sev{font-size:10px; letter-spacing:.08em; padding:1px 7px; border-radius:3px;
    border:1px solid color-mix(in srgb, var(--accent2) 50%, transparent); color:var(--accent2)}
  .find .d{color:var(--dim); font-size:12px; margin-top:5px}

  /* skills with icons */
  .sk{display:flex; gap:11px; align-items:flex-start; margin:9px 0}
  .sk .ico{flex:none; width:18px; height:18px; margin-top:1px; color:var(--accent)}
  .sk .ico svg{width:18px; height:18px; display:block; filter:drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 50%, transparent))}
  .sk .body{flex:1}
  .sk .t{color:var(--dim); font-size:11px; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:1px}
  .sk .v{color:var(--fg)}

  /* glitch text */
  .glitch{position:relative; display:inline-block}
  .glitch::before,.glitch::after{content:attr(data-text); position:absolute; left:0; top:0; width:100%; overflow:hidden}
  .glitch::before{color:var(--accent2); transform:translateX(-1.5px); clip-path:inset(0 0 55% 0); animation:gl1 2.4s infinite linear alternate-reverse; mix-blend-mode:screen}
  .glitch::after{color:var(--warn); transform:translateX(1.5px); clip-path:inset(55% 0 0 0); animation:gl2 1.9s infinite linear alternate; mix-blend-mode:screen}
  @keyframes gl1{0%{clip-path:inset(0 0 60% 0)}40%{clip-path:inset(20% 0 35% 0); transform:translateX(-2px)}80%{clip-path:inset(45% 0 12% 0)}100%{clip-path:inset(0 0 70% 0)}}
  @keyframes gl2{0%{clip-path:inset(60% 0 0 0)}45%{clip-path:inset(30% 0 25% 0); transform:translateX(2px)}100%{clip-path:inset(72% 0 0 0)}}

  .map{width:100%; max-width:560px; height:auto; margin:8px auto 16px; display:block}
  .map text{font-family:var(--mono); font-size:11px; fill:var(--dim)}
  .map text.you{fill:var(--accent); font-weight:700; font-size:12px}
  .map .ring{fill:none; stroke:var(--line); stroke-width:1}
  .map .cross{stroke:var(--line); stroke-width:1; opacity:.45}
  .map .ping{fill:none; stroke:var(--accent); stroke-width:1.4;
    transform-box:fill-box; transform-origin:center; animation:ping 3.2s ease-out infinite}
  .map .edge{stroke:var(--accent2); stroke-opacity:.45; stroke-width:1; fill:none;
    stroke-dasharray:170; stroke-dashoffset:170; animation:draw .9s forwards}
  .map .node{fill:var(--accent2); transform-box:fill-box; transform-origin:center;
    animation:nodepop .55s backwards; filter:drop-shadow(0 0 4px var(--accent2))}
  .map .core{fill:var(--accent); filter:drop-shadow(0 0 9px var(--accent))}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes nodepop{from{opacity:0; transform:scale(0)}}
  @keyframes ping{0%{transform:scale(.18); opacity:.55}80%,100%{transform:scale(1); opacity:0}}

  /* ---------- input line ---------- */
  .inputwrap{ flex:none; display:flex; align-items:center; padding:12px 18px; cursor:text; }
  .ps{color:var(--accent2); white-space:nowrap}
  .ps .at{color:var(--dim)}
  .field{position:relative; flex:1; min-width:0; margin-left:8px; display:flex; align-items:center}
  .field input{
    width:100%; background:transparent; border:none; outline:none;
    color:var(--fg); font:inherit; caret-color:transparent; padding:0;
  }
  .mirror{position:absolute; left:0; top:50%; transform:translateY(-50%); white-space:pre; visibility:hidden; pointer-events:none}
  .cursor{
    position:absolute; top:50%; transform:translateY(-50%);
    width:8.5px; height:1.05em; background:var(--accent);
    box-shadow:var(--glow); animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .chips{ flex:none; display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 14px; }
  .chip{
    border:1px solid var(--line); background:var(--panel); color:var(--dim);
    font:inherit; font-size:12.5px; padding:4px 11px; border-radius:5px; cursor:pointer; transition:.15s;
  }
  .chip:hover,.chip:focus-visible{border-color:var(--accent); color:var(--accent); outline:none}
  .chip b{color:var(--fg); font-weight:500}

  ::selection{background:var(--accent); color:#000}

  @media (max-width:680px){
    body{font-size:13.5px}
    .shell{padding:8px 8px 0}
    .status .clk, .status .ip{display:none}
    .finds{grid-template-columns:1fr}
    .kv{grid-template-columns:96px 1fr}
    .head .when{margin-left:0; width:100%}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important}
    #scan{display:none}
    .cursor{animation:none}
  }
</style>
</head>
<body>
  <div id="aura"></div>
  <div id="grid"></div>
  <canvas id="mx"></canvas>

  <div class="shell">

<script>
"use strict";
const OUT=document.getElementById('out');
const SCREEN=document.getElementById('screen');
const INPUT=document.getElementById('cmd');
const MIRROR=document.getElementById('mirror');
const CURSOR=document.getElementById('cursor');
const CHIPS=document.getElementById('chips');

const ME={
  handle:"cyrush", name:"Aarush Chandna", title:"offensive security engineer",

  phone:"+91 9755520758", status:"available for immediate joining",
  seeking:"junior red team \u00b7 ASM analyst \u00b7 pentest"
};

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function print(html,cls){
  const d=document.createElement('div');
  d.className='ln '+(cls||''); d.innerHTML=html;
  OUT.appendChild(d); SCREEN.scrollTop=SCREEN.scrollHeight; return d;
}
function echo(cmd){ print(`<span class="echo"><span class="p">root@cyrush</span>:~$ <span class="c">${esc(cmd)}</span></span>`); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const clk=document.getElementById('clk');
setInterval(()=>{clk.textContent=new Date().toTimeString().slice(0,8);},1000);

const CMD={};

CMD.help=()=>print(`

  <span class="dimmer">\u2191/\u2193 history \u00b7 tab to complete \u00b7 a few commands aren't in the list</span>

CMD.whoami=()=>print(`
<div class="kv">
  <span class="k">handle</span><span class="v acc">${ME.handle}</span>

  <span class="k">focus</span><span class="v">${ME.focus}</span>

  <span class="k">status</span><span class="v ok">${ME.status}</span>

</div>
<span class="muted">// enterprise ASM + AD red teaming. i find what shouldn't be exposed,
// prove it's exploitable, and write it up before it bites. CRTP/CRTE/ADCS certified.</span>

CMD.experience=()=>print(`
<div class="block hit">
  <div class="head"><span class="role">Security Intern &mdash; CPS / ASM</span><span class="acc2">@</span><span class="org">RedHunt Labs</span><span class="when">FEB 2026 — JUN 2026</span></div>
  <div class="summary">Continuous attack-surface monitoring for enterprise clients &mdash; find the exposure before an attacker does, prove it, push the fix.</div>
  <div class="li">Ran ASM engagements for <b>9 enterprise clients</b> &mdash; mapped exposed assets, shadow IT, and external attack paths.</div>
  <div class="li">Identified &amp; validated multiple <b>P1 / critical</b> findings &mdash; all escalated and remediated within SLA.</div>

function drawMap(){
  return new Promise(res=>{
    const W=560,H=380,cx=280,cy=188,maxR=152;
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const orgs=FINDINGS.map(f=>f[0]);
    const n=orgs.length;

    const rings=[58,105,152].map(r=>`<circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/>`).join('');
    const cross=`<line class="cross" x1="${cx-maxR}" y1="${cy}" x2="${cx+maxR}" y2="${cy}"/>`+
                `<line class="cross" x1="${cx}" y1="${cy-maxR}" x2="${cx}" y2="${cy+maxR}"/>`;

    // rotating sweep wedge
    const sa=-Math.PI/2, span=58*Math.PI/180;
    const p1x=cx+Math.cos(sa)*maxR, p1y=cy+Math.sin(sa)*maxR;
    const p2x=cx+Math.cos(sa+span)*maxR, p2y=cy+Math.sin(sa+span)*maxR;
    const wedge=`M${cx},${cy} L${p1x.toFixed(1)},${p1y.toFixed(1)} A${maxR},${maxR} 0 0 1 ${p2x.toFixed(1)},${p2y.toFixed(1)} Z`;
    const spin=reduce?'':`<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="6s" repeatCount="indefinite"/>`;
    const sweep=`<g><path d="${wedge}" fill="url(#sweepg)"/>${spin}</g>`;

    let edges='',nodes='',labels='';
    orgs.forEach((o,i)=>{
      const ang=(-Math.PI/2)+(i*(2*Math.PI/n));
      const r=96+((i*53)%50);                 // 96..146, organic spread
      const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      edges+=`<line class="edge" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="animation-delay:${i*80}ms"/>`;
      nodes+=`<circle class="node" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" style="animation-delay:${260+i*90}ms"/>`;
      const lx=cx+Math.cos(ang)*(r+13), ly=cy+Math.sin(ang)*(r+13), c=Math.cos(ang);
      const anchor=c>0.25?'start':(c<-0.25?'end':'middle');
      labels+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anchor}">${o}</text>`;
    });

    print(`<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="discovered asset radar">
      <defs><radialGradient id="sweepg" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${maxR}">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".34"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </radialGradient></defs>
      ${rings}${cross}
      <circle class="ping" cx="${cx}" cy="${cy}" r="${maxR}"/>
      ${sweep}
      ${edges}
      <circle class="core" cx="${cx}" cy="${cy}" r="6"/>
      <text class="you" x="${cx}" y="${cy-14}" text-anchor="middle">cyrush</text>
      ${nodes}${labels}
    </svg>`);
    setTimeout(res,800);
  });
}

const mxCanvas=document.getElementById('mx');

function toggleMatrix(){
  mxOn=!mxOn;
  if(mxOn){mxCanvas.style.opacity='.14'; sizeMx(); mxRAF=requestAnimationFrame(mxLoop);}
  else{mxCanvas.style.opacity='0'; cancelAnimationFrame(mxRAF);}
}
function sizeMx(){
  mxCanvas.width=innerWidth; mxCanvas.height=innerHeight;
  mxDrops=Array(Math.floor(innerWidth/14)).fill(0).map(()=>Math.random()*-50);
}
function mxLoop(t){
  mxRAF=requestAnimationFrame(mxLoop);
  if(t-mxLast<55)return; mxLast=t;
  const ctx=mxCanvas.getContext('2d');
  ctx.fillStyle='rgba(10,11,13,.25)'; ctx.fillRect(0,0,mxCanvas.width,mxCanvas.height);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  ctx.font='13px monospace';
  mxDrops.forEach((y,i)=>{
    ctx.fillText(String.fromCharCode(0x30a0+Math.random()*96), i*14, y*14);
    mxDrops[i]=(y*14>mxCanvas.height && Math.random()>.975)?0:y+1;
  });
}

const history=[]; let hIdx=-1;
function syncCursor(){ MIRROR.textContent=INPUT.value; CURSOR.style.left=MIRROR.offsetWidth+'px'; }
INPUT.addEventListener('input',syncCursor);
document.getElementById('inputwrap').addEventListener('click',()=>INPUT.focus());
addEventListener('keydown',e=>{ if(e.key.length===1 && document.activeElement!==INPUT) INPUT.focus(); });

INPUT.addEventListener('keydown',async e=>{
  if(e.key==='Enter'){
    const v=INPUT.value; echo(v);
    if(v.trim()){history.push(v); hIdx=history.length;}
    INPUT.value=''; syncCursor(); await run(v);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(history.length){hIdx=Math.max(0,hIdx-1); INPUT.value=history[hIdx]||''; syncCursor();}
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(history.length){hIdx=Math.min(history.length,hIdx+1); INPUT.value=history[hIdx]||''; syncCursor();}
  }else if(e.key==='Tab'){
    e.preventDefault();
    const v=INPUT.value.toLowerCase();
    const m=Object.keys(CMD).concat(Object.keys(ALIASES)).filter(c=>c.startsWith(v));
    if(m.length===1){INPUT.value=m[0]; syncCursor();}
    else if(m.length>1){echo(v); print('<span class="muted">'+m.join('   ')+'</span>','pad');}
  }else if(e.ctrlKey && e.key.toLowerCase()==='l'){ e.preventDefault(); CMD.clear(); }
});

function scramble(el, finalText, dur){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ el.textContent=finalText; return Promise.resolve(); }
  const chars='!<>-_\\/[]{}=+*^?#01abcdef';
  const start=performance.now();
  return new Promise(res=>{
    (function frame(t){
      const p=Math.min(1,(t-start)/(dur||650));
      const reveal=Math.floor(p*finalText.length);
      let out='';
      for(let i=0;i<finalText.length;i++){
        out += (i<reveal||finalText[i]===' ') ? finalText[i] : chars[(Math.random()*chars.length)|0];
      }
      el.textContent=out;
      if(p<1) requestAnimationFrame(frame); else { el.textContent=finalText; res(); }
    })(start);
  });
}
